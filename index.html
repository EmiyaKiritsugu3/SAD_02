<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mercadinho Seridó — SAD de compra semanal para um mercadinho de bairro em Caicó/RN. Preveja as vendas e saiba quanto comprar de cada produto.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b5522f'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='26' fill='%23fff8ee' text-anchor='middle'%3EMS%3C/text%3E%3C/svg%3E">
  <title>Mercadinho Seridó — SAD de compra semanal</title>
  <link rel="stylesheet" href="style.css?v=20261127f">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <div class="app">
    <header class="topbar">
      <button class="marca" type="button" data-aba="compras" aria-label="Ir para Compras">
        <span class="marca-mark" aria-hidden="true">MS</span>
        <span class="marca-texto">
          <strong>Mercadinho Seridó</strong>
          <small>Caicó/RN</small>
        </span>
      </button>

      <nav class="abas" aria-label="Navegação principal">
        <button class="aba ativa" type="button" data-aba="compras" aria-current="page">Compras</button>
        <button class="aba" type="button" data-aba="vendas">Vendas</button>
        <button class="aba" type="button" data-aba="produtos">Produtos</button>
      </nav>

      <span id="badge-exemplo" class="badge" hidden>Dados de exemplo</span>
    </header>

    <main id="conteudo" class="main" tabindex="-1">
      <div id="aviso-persistencia" class="aviso perigo" role="alert" hidden></div>
      <section id="app" aria-label="Conteúdo da aba"></section>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </main>

    <footer class="rodape">
      <span>Camada de decisão semanal. Não substitui o caixa ou o ERP do mercadinho.</span>
      <span>Os dados ficam salvos neste navegador.</span>
    </footer>
  </div>

  <noscript>Este SAD precisa de JavaScript habilitado para prever as vendas e sugerir a compra.</noscript>

  <script src="js/datas.js?v=20261127f"></script>
  <script src="js/estado.js?v=20261127f"></script>
  <script src="js/produtos.js?v=20261127f"></script>
  <script src="js/vendas.js?v=20261127f"></script>
  <script src="js/previsao.js?v=20261127f"></script>
  <script src="js/compras.js?v=20261127f"></script>
  <script src="js/charts.js?v=20261127f"></script>
  <script src="js/app.js?v=20261127f"></script>
</body>
</html>
